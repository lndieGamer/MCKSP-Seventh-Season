# unsup: группы вариантов сборки
# Лежит рядом с pack.toml. packwiz его не трогает.
# id выборов уникальны глобально: в _unsup-state.json они хранятся
# плоским списком, без имени группы.

[flavor_groups.graphics]
name = "Графические моды"
description = "Поддержка шейдеров, distant horizons (256+ чанков прорисовки), детальные текстуры мобов, волны и осадки.\nСамая заметная нагрузка на видеокарту."
side = "client"

[[flavor_groups.graphics.choices]]
id = "graphics_on"
name = "Включить"

[[flavor_groups.graphics.choices]]
id = "graphics_off"
name = "Отключить (8 модов)"

[flavor_groups.sound]
name = "Звуковое окружение"
description = "AmbientSounds — шумы леса, пещер, погоды. 85 МБ аудио в памяти."
side = "client"

[[flavor_groups.sound.choices]]
id = "sound_on"
name = "Включить"

[[flavor_groups.sound.choices]]
id = "sound_off"
name = "Отключить (1 модов)"

[flavor_groups.minimap]
name = "Мини-карта Xaero"
description = "Карта в углу экрана с отметками существ и игроков.\nФоновое кеширование чанков и запись на диск."
side = "client"

[[flavor_groups.minimap.choices]]
id = "minimap_on"
name = "Включить"

[[flavor_groups.minimap.choices]]
id = "minimap_off"
name = "Отключить (1 мод)"

[flavor_groups.worldmap]
name = "Мировая карта Xaero"
description = "Полноэкранная карта по клавише M, с путевыми точками.\nНезависима от мини-карты."
side = "client"

[[flavor_groups.worldmap.choices]]
id = "worldmap_on"
name = "Включить"

[[flavor_groups.worldmap.choices]]
id = "worldmap_off"
name = "Отключить (1 мод)"

[flavor_groups.ui]
name = "Удобства интерфейса"
description = "Mouse Tweaks, подсказки к зачарованиям, зум, оверлеи, достижения, пинг.\nНа FPS почти не влияют, но заметно упрощают игру."
side = "client"

[[flavor_groups.ui.choices]]
id = "ui_on"
name = "Включить"

[[flavor_groups.ui.choices]]
id = "ui_off"
name = "Отключить (12 модов)"

[flavor_groups.menu]
name = "Оформленное меню"
description = "FancyMenu с фоном и музыкой. Работает только в главном меню, на игру не влияет."
side = "client"

[[flavor_groups.menu.choices]]
id = "menu_on"
name = "Включить"

[[flavor_groups.menu.choices]]
id = "menu_off"
name = "Отключить (3 модов)"

# ---- принадлежность модов ----

# graphics — Тяжёлая графика
[metafile.irisshaders]
flavors = ["graphics_on"]
[metafile.distant-horizons]
