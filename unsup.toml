# unsup: галочка на каждый клиентский мод.
# Файл лежит рядом с pack.toml, packwiz его не трогает.
# Генерируется и дополняется скриптом add-mods.ps1.
#
# Семантика флейворов у файла — ИЛИ: мод ставится, если совпал хотя бы
# один из перечисленных. На этом держится привязка библиотек: они
# перечисляют галочки всех своих потребителей.

