# unsup: галочка на каждый клиентский мод.
# Лежит рядом с pack.toml, packwiz его не трогает.
# Дополняется скриптом add-mods.ps1 при добавлении новых модов.
#
# Зависимостей у групп нет — unsup их не поддерживает. Вместо этого
# библиотека перечисляет галочки всех своих потребителей: флейворы
# файла проверяются по ИЛИ, поэтому она ставится, если включён хотя бы
# один мод, которому она нужна. Отключить библиотеку "из-под" мода,
# который её требует, невозможно — и это защищает от падения.

