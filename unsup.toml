# unsup: варианты сборки
# Лежит рядом с pack.toml. packwiz его не трогает.

[flavor_groups.preset]
name = "Вариант сборки"
description = "Полная — всё как задумано.\nОблегчённая убирает шейдеры, дальнюю прорисовку, детальные текстуры, звуковое окружение, карты и часть интерфейса.\nИгровые механики и совместимость с сервером одинаковые."
side = "client"

[[flavor_groups.preset.choices]]
id = "full"
name = "Полная"
description = "Рекомендуется, если компьютер справляется."

[[flavor_groups.preset.choices]]
id = "lite"
name = "Облегчённая"
description = "Для слабых ПК. Убирает 26 клиентских модов."

# --- моды только для полной версии ---

