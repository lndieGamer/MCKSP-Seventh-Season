# fusion-connected-textures не отключаем: его требует rechiseled,
# а rechiseled стоит на обеих сторонах и всегда установлен
# coastal-waves не отключаем: регистрирует обязательный сетевой канал
# waves:presence, поэтому переведён в side = "both"
