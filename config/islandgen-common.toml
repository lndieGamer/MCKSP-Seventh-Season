[global]
	#Master on/off switch for all IslandGen island generation.
	enabled = true
	#Log every island placement to the console (disable in production).
	verbose_logging = false
	#Allow rare island biome themes: Volcanic, Coral, Nether Crimson, Nether Warped.
	rare_themes_enabled = true

#Size of the hand-crafted spawn island placed at world origin.
[spawn_island]
	#Minimum spawn island radius in blocks.
	# Default: 36
	# Range: 10 ~ 200
	radius_min = 200
	#Maximum spawn island radius in blocks.
	# Default: 48
	# Range: 10 ~ 200
	radius_max = 200
	#Minimum height above sea level.
	# Default: 10
	# Range: 2 ~ 64
	height_min = 10
	#Maximum height above sea level.
	# Default: 16
	# Range: 2 ~ 64
	height_max = 64

#Toggle and tune individual world-gen features.
[features]
	#Place a starter shack with chest and villagers on the spawn island.
	starter_shack_enabled = true
	#Generate a hidden End Portal room below the spawn island.
	end_portal_enabled = true
	#Generate secret loot caves inside islands.
	cave_enabled = true
	#Probability (0.0–1.0) that a qualifying island gets a cave.
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	cave_chance = 0.4
	#Place a chest and optional spawner inside caves.
	cave_loot_enabled = true
	#Spawn theme-appropriate animals on islands.
	animal_spawning_enabled = true
	#Generate intricate cave networks with ores, dungeons, and boss chambers below the ocean floor.
	sub_ocean_caves_enabled = true

#Control ocean barrel spawning and loot tiers.
[loot]
	#Whether ocean loot barrels should spawn at all.
	barrel_spawn_enabled = true
	#Minimum number of barrels placed per spawn event (1 = vanilla density).
	# Default: 1
	# Range: 1 ~ 16
	barrel_count_min = 1
	#Maximum number of barrels placed per spawn event (raise to increase density).
	# Default: 1
	# Range: 1 ~ 16
	barrel_count_max = 1
	#Probability (0.0–1.0) that a barrel contains one uncommon item.
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	barrel_uncommon_chance = 0.3
	#Probability (0.0–1.0) that a barrel contains one rare item.
	# Default: 0.08
	# Range: 0.0 ~ 1.0
	barrel_rare_chance = 0.08

#Archipelago preset – spawns in standard, cold and frozen oceans.
#Radius/height/depth are sampled as random integers between [min, max].
#shape_exponent controls how steeply the island tapers (higher = steeper cliffs).
#beach_band is the fraction of the radius treated as shoreline (0.0 – 0.45).
#min_ocean_depth – island only places if the ocean floor is at least this many
#  blocks below sea level.
[archipelago]
	#Minimum island radius in blocks.
	# Default: 18
	# Range: 6 ~ 300
	radius_min = 18
	#Maximum island radius in blocks.
	# Default: 24
	# Range: 6 ~ 300
	radius_max = 24
	#Minimum height above sea level.
	# Default: 6
	# Range: 2 ~ 64
	height_min = 6
	#Maximum height above sea level.
	# Default: 14
	# Range: 2 ~ 64
	height_max = 14
	#Minimum depth below ocean floor.
	# Default: 3
	# Range: 2 ~ 40
	depth_min = 3
	#Maximum depth below ocean floor.
	# Default: 8
	# Range: 2 ~ 40
	depth_max = 8
	#Required ocean depth before an island can spawn.
	# Default: 10
	# Range: 1 ~ 64
	min_ocean_depth = 10
	#Dome smoothness (1.5=gentle hill, 4.0=steep).
	# Default: 2.0
	# Range: 0.5 ~ 6.0
	shape_exponent = 2.0
	#Beach width as fraction of radius (0.0–0.45).
	# Default: 0.35
	# Range: 0.0 ~ 0.45
	beach_band = 0.35

#Large-sparse preset – spawns in deep ocean variants.
[large_sparse]
	#Minimum island radius in blocks.
	# Default: 20
	# Range: 6 ~ 300
	radius_min = 20
	#Maximum island radius in blocks.
	# Default: 26
	# Range: 6 ~ 300
	radius_max = 26
	#Minimum height above sea level.
	# Default: 8
	# Range: 2 ~ 64
	height_min = 8
	#Maximum height above sea level.
	# Default: 18
	# Range: 2 ~ 64
	height_max = 18
	#Minimum depth below ocean floor.
	# Default: 6
	# Range: 2 ~ 40
	depth_min = 6
	#Maximum depth below ocean floor.
	# Default: 12
	# Range: 2 ~ 40
	depth_max = 12
	#Required ocean depth before an island can spawn.
	# Default: 22
	# Range: 1 ~ 64
	min_ocean_depth = 22
	#Dome smoothness (1.5=gentle hill, 4.0=steep).
	# Default: 2.0
	# Range: 0.5 ~ 6.0
	shape_exponent = 2.0
	#Beach width as fraction of radius (0.0–0.45).
	# Default: 0.25
	# Range: 0.0 ~ 0.45
	beach_band = 0.25

#Tropical preset – spawns in warm and lukewarm oceans.
[tropical]
	#Minimum island radius in blocks.
	# Default: 14
	# Range: 6 ~ 300
	radius_min = 14
	#Maximum island radius in blocks.
	# Default: 22
	# Range: 6 ~ 300
	radius_max = 22
	#Minimum height above sea level.
	# Default: 4
	# Range: 2 ~ 64
	height_min = 4
	#Maximum height above sea level.
	# Default: 10
	# Range: 2 ~ 64
	height_max = 10
	#Minimum depth below ocean floor.
	# Default: 3
	# Range: 2 ~ 40
	depth_min = 3
	#Maximum depth below ocean floor.
	# Default: 7
	# Range: 2 ~ 40
	depth_max = 7
	#Required ocean depth before an island can spawn.
	# Default: 9
	# Range: 1 ~ 64
	min_ocean_depth = 9
	#Dome smoothness (1.5=gentle hill, 4.0=steep).
	# Default: 2.0
	# Range: 0.5 ~ 6.0
	shape_exponent = 2.0
	#Beach width as fraction of radius (0.0–0.45).
	# Default: 0.4
	# Range: 0.0 ~ 0.45
	beach_band = 0.4
